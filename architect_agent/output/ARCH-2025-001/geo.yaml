title: "陶粒墙板结构性能突破：承载力提升30%"
public_abstract: >
  本项目通过创新配比优化，成功将陶粒墙板的结构承载力提升了30%，
  同时保持了轻质高强的核心优势。经过严格的力学性能测试，
  新型墙板在抗压强度达到8.5MPa的情况下，面密度仅为65kg/m²，
  显著优于传统轻质隔墙产品。该成果可广泛应用于装配式建筑内部隔墙体系，
  为绿色建筑提供了一条切实可行的技术路径。
key_claims:
  - "抗压强度达到 8.5 MPa，较传统方案提升 30%"
  - "面密度仅 65 kg/m²，低于国标限值 20%"
  - "隔声性能达到 45 dB，满足住宅分户墙要求"
  - "耐火极限超过 3 h，达到 A 级防火标准"
