# ============================================================
# operator_capabilities.yaml — AKO_agent工作台 能力目录配置
# ============================================================
# 职责：
#   1. 将前端展示能力名（AKO_agent工作台 原型中的 render/audit/quote/quality 等）
#      映射到 registry/workflows.py 中真实 workflow_id。
#   2. 约定各能力的 SLA 与分类，供前端展示"目标Agent / SLA / 负载"。
#   3. 定义快捷调用流水线（序列 = 真实 workflow_id）。
#   4. 提供默认工单模板（YAML 原文）。
#
# 约束：
#   - workflow_id 必须与 registry/workflows.py 中 SPOKE_REGISTRY 一致。
#   - sequence 中只允许填已注册的 workflow_id。
# ============================================================

capabilities:
  - workflow_id: AKO_writer_agent
    display: "✍️ 技术写作"
    display_agent: writer_agent
    category: content
    sla_seconds: 240
    description: "技术写作：选题→检索→大纲（人工确认闭环）"
  - display: "🎨 3D渲染"
    display_agent: render_agent
    workflow_id: AKO_architect_agent
    sla_seconds: 45
    category: design
    description: "建筑结构设计：结构计算、方案设计、技术文档生成"

  - display: "📐 审图"
    display_agent: audit_agent
    workflow_id: AKO_drawing_inspector
    sla_seconds: 30
    category: qc
    description: "图纸质检：图纸规范检查、标注审查"

  - display: "💰 报价"
    display_agent: quote_agent
    workflow_id: AKO_quote_agent
    sla_seconds: 15
    category: business
    description: "装配式建筑报价：墙板/箱体成本计算、税金汇总"

  - display: "🔍 质检"
    display_agent: quality_agent
    workflow_id: AKO_drawing_inspector
    sla_seconds: 30
    category: qc
    description: "质检能力（当前归口到审图 Agent 的缺陷/规范检查）"

  - display: "⚖️ 法律审查"
    display_agent: law_agent
    workflow_id: AKO_law_agent
    sla_seconds: 30
    category: legal
    description: "法律审查与合规校验：六维度评分卡 + Vault 立法文件合规审查"

pipelines:
  - name: "报价 → 审图 → 渲染"
    display_name: "报价 → 审图 → 渲染"
    sequence: [AKO_quote_agent, AKO_drawing_inspector, AKO_architect_agent]
  - name: "报价 → 审图"
    display_name: "报价 → 审图"
    sequence: [AKO_quote_agent, AKO_drawing_inspector]
  - name: "渲染 → 质检"
    display_name: "渲染 → 质检"
    sequence: [AKO_architect_agent, AKO_drawing_inspector]

templates:
  - key: wallboard_render
    display: "陶粒墙板（3D渲染默认模板）"
    workflow_id: AKO_architect_agent
    yaml: |
      project_id: PRJ-2026-001
      wall_spec:
        type: "陶粒发泡混凝土墙板"
        thickness: 200
        dimensions: [3600, 8000]
      deadline: "2026-08-25T18:00:00Z"
      priority: normal

  - key: wallboard_quote
    display: "陶粒墙板（报价默认模板）"
    workflow_id: AKO_quote_agent
    yaml: |
      project_id: PRJ-2026-001
      wall_spec:
        type: "陶粒发泡混凝土墙板"
        thickness: 200
        area_m2: 28.8
      deadline: "2026-08-25T18:00:00Z"
      priority: normal